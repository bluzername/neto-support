name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Links in Markdown files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check http(s) links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme https --scheme http "./**/*.md"
          fail: true

  live-pages:
    name: Live GitHub Pages URLs
    runs-on: ubuntu-latest
    steps:
      - name: Expect HTTP 200 from every published page
        run: |
          base="https://bluzername.github.io/neto-support"
          status=0
          for path in privacy-policy support kabala-privacy kabala-support zakaut-privacy zakaut-support zakaut-rates.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base/$path")
            echo "$code  $base/$path"
            if [ "$code" != "200" ]; then status=1; fi
          done
          exit "$status"
