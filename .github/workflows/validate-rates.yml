name: Validate rates

on:
  push:
    branches: [main]
    paths:
      - zakaut-rates.json
      - scripts/validate_rates.py
      - .github/workflows/validate-rates.yml
  pull_request:
    paths:
      - zakaut-rates.json
      - scripts/validate_rates.py
      - .github/workflows/validate-rates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: zakaut-rates.json schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 scripts/validate_rates.py zakaut-rates.json
